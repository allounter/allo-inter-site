
backend:
  name: github
  repo: allounter/allo-inter-site
  branch: main

locale: fr

media_folder: "images"
public_folder: "/images"

collections:
  - name: "gestion_tarifs"
    label: "Prestations et tarifs"
    files:
      - name: "tarifs"
        label: "Tarifs ALLO INTER"
        file: "tarifs.json"
        format: "json"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{fields.nom}}"
            fields:
              - label: "Nom de la catégorie"
                name: "nom"
                widget: "string"

              - label: "Prestations"
                name: "prestations"
                widget: "list"
                summary: "{{fields.nom}}"
                fields:
                  - label: "Nom de la prestation"
                    name: "nom"
                    widget: "string"

                  - label: "Prix à partir de (€)"
                    name: "prix"
                    widget: "number"
                    value_type: "int"
                    min: 0
                    step: 1
          
          - label: "Frais de déplacement (€)"
            name: "frais_deplacement"
            widget: "number"
            value_type: "int"
            default: 60
            min: 0

          - label: "Majoration soir et week-end (%)"
            name: "majoration_soir_weekend"
            widget: "number"
            value_type: "int"
            default: 50
            min: 0

          - label: "Majoration nuit et jours fériés (%)"
            name: "majoration_nuit_feries"
            widget: "number"
            value_type: "int"
            default: 100
            min: 0

          - label: "Fournitures en supplément"
            name: "fournitures_supplement"
            widget: "boolean"
            default: true
